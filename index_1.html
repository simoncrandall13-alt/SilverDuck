<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SilverDuck</title>
<style>
  :root{
    --bg:#0e1420; --panel:#162032; --ink:#eaf1ff; --muted:#8ba0c4;
    --duck:#f4c430; --accent:#3ddc97; --danger:#ff5d6c; --line:#26344d;
    color-scheme: dark;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, #1b2740 0%, transparent 60%),
      radial-gradient(700px 500px at -10% 110%, #14202f 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    overflow:hidden;
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  #menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    gap:26px;padding:34px 22px 40px;overflow:auto}
  .brand{display:flex;align-items:center;gap:14px;flex-direction:column;text-align:center}
  .logo{width:66px;height:66px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4))}
  h1{font-size:clamp(28px,6.5vw,48px);letter-spacing:1px;line-height:1}
  h1 span{color:var(--duck)}
  .tag{color:var(--muted);font-size:14px;margin-top:6px;max-width:40ch}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;width:100%;max-width:760px}
  .card{background:linear-gradient(180deg,var(--panel),#121b2b);border:1px solid var(--line);
    border-radius:16px;padding:18px;cursor:pointer;
    transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;}
  .card:hover,.card:focus-visible{transform:translateY(-4px);border-color:#3b5176;
    box-shadow:0 12px 30px rgba(0,0,0,.35);outline:none}
  .card h2{font-size:19px;margin-bottom:5px}
  .card p{color:var(--muted);font-size:12.5px;line-height:1.5}
  .card .art{height:78px;border-radius:11px;margin-bottom:13px;display:flex;align-items:center;
    justify-content:center;font-size:42px;background:radial-gradient(circle at 50% 60%,#223450,#141d2d)}
  .foot{color:var(--muted);font-size:12px;text-align:center;max-width:52ch;line-height:1.6}

  #game{position:absolute;inset:0;display:none;flex-direction:column}
  #game.on{display:flex}
  #stage{flex:1;position:relative;touch-action:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;
    align-items:flex-start;padding:14px 16px;pointer-events:none;gap:8px}
  .hud .chip{background:rgba(10,16,26,.66);border:1px solid var(--line);border-radius:999px;
    padding:7px 13px;font-size:13px;font-weight:bold;backdrop-filter:blur(4px)}
  .hud .chip small{font-weight:normal;color:var(--muted)}
  .btn{pointer-events:auto;background:rgba(10,16,26,.72);border:1px solid var(--line);
    color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:bold}
  .btn:active{transform:scale(.96)}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;text-align:center;padding:24px;
    background:rgba(8,12,20,.8);backdrop-filter:blur(3px)}
  .overlay h3{font-size:clamp(24px,6vw,40px)}
  .big{display:inline-flex;gap:10px;align-items:baseline}
  .big b{color:var(--duck);font-size:34px}
  .play{background:var(--duck);color:#1a1200;border:none;border-radius:14px;padding:14px 30px;
    font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 8px 20px rgba(244,196,48,.25)}
  .play:active{transform:scale(.97)}
  .ghost{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:12px;
    padding:11px 20px;font-size:14px;cursor:pointer}
  .hide{display:none!important}
  .keys{color:var(--muted);font-size:13px;line-height:1.8;max-width:42ch}
  kbd{background:#0a0f1a;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;
    padding:1px 7px;font-family:inherit;font-size:12px;color:var(--ink)}
  p.ov{color:var(--muted);max-width:40ch;line-height:1.6;font-size:14px}
</style>
</head>
<body>
<div id="app">
  <section id="menu">
    <div class="brand">
      <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="50" cy="66" rx="30" ry="22" fill="#cfd8e8"/>
        <ellipse cx="50" cy="60" rx="24" ry="18" fill="#eef2fa"/>
        <circle cx="62" cy="40" r="17" fill="#f4f7fc"/>
        <circle cx="67" cy="37" r="3.4" fill="#172033"/>
        <path d="M76 40 l14 3 -14 5 z" fill="#f4c430"/>
      </svg>
      <div>
        <h1>Silver<span>Duck</span></h1>
        <div class="tag">Original games, built from scratch. Nothing to download — just play.</div>
      </div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="foot">Scores and progress save on this device. Keyboard + mouse on a computer, touch on a phone.</div>
  </section>

  <section id="game">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div class="hud">
        <button class="btn" id="back">&lsaquo; Menu</button>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
          <div class="chip" id="hud1"></div>
          <div class="chip" id="hud2"></div>
        </div>
      </div>
      <div class="overlay" id="startCard">
        <h3 id="startTitle"></h3>
        <div class="keys" id="startKeys"></div>
        <button class="play" id="playBtn">Play</button>
        <button class="ghost" id="backCard">Back to menu</button>
      </div>
      <div class="overlay hide" id="overCard">
        <h3 id="overTitle">Game over</h3>
        <div class="big"><span id="overLabel"></span><b id="overScore"></b></div>
        <p class="ov" id="overBest"></p>
        <button class="play" id="retryBtn">Play again</button>
        <button class="ghost" id="backCard2">Back to menu</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  "use strict";
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const stage=document.getElementById('stage'), menu=document.getElementById('menu'), gameEl=document.getElementById('game');
  let W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=stage.clientWidth; H=stage.clientHeight;
    cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize);

  const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
               set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

  const keys={}, pointer={x:0,y:0,down:false,px:0,py:0};
  let presses=[], releases=[];
  window.addEventListener('keydown',e=>{
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
    keys[e.key.toLowerCase()]=true; keys[e.code]=true;
  });
  window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false; keys[e.code]=false;});
  function toLocal(ev){const r=cv.getBoundingClientRect();const t=ev.touches&&ev.touches[0]?ev.touches[0]:ev;return{x:t.clientX-r.left,y:t.clientY-r.top};}
  function press(p){pointer.x=p.x;pointer.y=p.y;pointer.down=true;pointer.px=p.x;pointer.py=p.y;presses.push({x:p.x,y:p.y});}
  function release(){if(pointer.down){releases.push({x:pointer.x,y:pointer.y,dx:pointer.x-pointer.px,dy:pointer.y-pointer.py});}pointer.down=false;}
  stage.addEventListener('mousedown',e=>press(toLocal(e)));
  stage.addEventListener('mousemove',e=>{const p=toLocal(e);pointer.x=p.x;pointer.y=p.y;});
  window.addEventListener('mouseup',release);
  stage.addEventListener('touchstart',e=>{press(toLocal(e));},{passive:true});
  stage.addEventListener('touchmove',e=>{const p=toLocal(e);pointer.x=p.x;pointer.y=p.y;},{passive:true});
  window.addEventListener('touchend',release);
  const isTouch='ontouchstart' in window;

  let current=null, raf=0, last=0;
  function loop(ts){
    const dt=Math.min(0.033,(ts-last)/1000)||0; last=ts;
    if(current){current.update(dt);current.draw();}
    presses.length=0; releases.length=0;
    raf=requestAnimationFrame(loop);
  }

  const hud1=document.getElementById('hud1'),hud2=document.getElementById('hud2');
  const startCard=document.getElementById('startCard'),overCard=document.getElementById('overCard');
  const startTitle=document.getElementById('startTitle'),startKeys=document.getElementById('startKeys');
  const overLabel=document.getElementById('overLabel'),overScore=document.getElementById('overScore'),overBest=document.getElementById('overBest');

  function openGame(def){
    menu.style.display='none'; gameEl.classList.add('on'); resize();
    current=def; current.setup();
    startTitle.textContent=def.title; startKeys.innerHTML=def.help;
    startCard.classList.remove('hide'); overCard.classList.add('hide');
    current.paused=true; last=performance.now();
    cancelAnimationFrame(raf); raf=requestAnimationFrame(loop);
  }
  function backToMenu(){ if(current&&current.onLeave)current.onLeave(); cancelAnimationFrame(raf); current=null; gameEl.classList.remove('on'); menu.style.display='flex'; }
  function startPlay(){ startCard.classList.add('hide'); overCard.classList.add('hide'); current.start(); current.paused=false; }
  window.showOver=function(){
    overCard.classList.remove('hide');
    overLabel.textContent=current.overLabel+' ';
    overScore.textContent=current.score;
    overBest.textContent='Best '+current.overLabel.toLowerCase()+': '+current.best+(current.score>=current.best?'  — new record!':'');
  };

  document.getElementById('back').addEventListener('click',backToMenu);
  document.getElementById('backCard').addEventListener('click',backToMenu);
  document.getElementById('backCard2').addEventListener('click',backToMenu);
  document.getElementById('playBtn').addEventListener('click',startPlay);
  document.getElementById('retryBtn').addEventListener('click',startPlay);

  const rand=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, randi=(a,b)=>Math.floor(rand(a,b));
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function hx(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function mix(a,b,t){const pa=hx(a),pb=hx(b);return'rgb('+Math.round(pa[0]+(pb[0]-pa[0])*t)+','+Math.round(pa[1]+(pb[1]-pa[1])*t)+','+Math.round(pa[2]+(pb[2]-pa[2])*t)+')';}
  function fmt(n){ if(n<1000)return(n%1===0?n:n.toFixed(1)); const u=['k','M','B','T'];let i=-1;do{n/=1000;i++;}while(n>=1000&&i<u.length-1);return n.toFixed(1)+u[i]; }

  /* ============ SHELL SHOCK ============ */
  const Shooter={
    title:"Shell Shock",
    help:'<p>Slice the flying eggs with a swipe — but never slice a bomb egg! Let an egg fall and you lose a heart. Clear a round and pick an upgrade.</p><p>Drag / swipe across eggs to slice them. Mouse or finger.</p>',
    best:0, overLabel:"Score",
    pool:[
      {n:'Longer Blade',d:'Bigger slice reach',a:s=>s.reach+=12},
      {n:'Extra Heart',d:'+1 life',a:s=>{s.maxLives++;s.lives++;}},
      {n:'Double Points',d:'All slices score more',a:s=>s.mult+=1},
      {n:'Golden Luck',d:'More golden eggs',a:s=>s.goldChance+=0.08},
      {n:'Bomb Shield',d:'Survive one bomb',a:s=>s.shield++},
      {n:'Combo Master',d:'Combos worth more',a:s=>s.comboBoost+=0.6},
      {n:'Floaty Eggs',d:'Eggs hang in the air longer',a:s=>s.grav*=0.86},
    ],
    setup(){this.best=store.get('sd_shoot_best',0);this.reset();},
    reset(){this.objs=[];this.trail=[];this.parts=[];this.shards=[];this.rings=[];this.score=0;this.combo=0;this.comboT=0;
      this.lives=3;this.maxLives=3;this.round=0;this.reach=26;this.mult=1;this.goldChance=0.08;this.shield=0;this.comboBoost=1;this.grav=1050;
      this.spawnT=0;this.left=0;this.mode='playing';this.alive=true;this.cards=[];this.cardRects=[];this.flash=0;this.last=null;this.beginRound();this.updateHud();},
    start(){this.reset();},
    beginRound(){this.round++;this.left=10+this.round*4;this.spawnT=0.6;this.mode='playing';},
    updateHud(){hud1.innerHTML='<small>Score</small> '+this.score;hud2.innerHTML='<small>Round '+this.round+'</small> '+(this.shield>0?'🛡 ':'')+'❤'.repeat(Math.max(0,this.lives));},
    openShop(){this.mode='shop';const idx=[];while(idx.length<3){const i=randi(0,this.pool.length);if(idx.indexOf(i)<0)idx.push(i);}this.cards=idx.map(i=>this.pool[i]);},
    spawn(){const bomb=Math.random()<Math.min(0.22,0.07+this.round*0.012);const gold=!bomb&&Math.random()<this.goldChance;
      const x=rand(W*0.15,W*0.85);const vx=rand(-40,40)+(x<W/2?40:-40);const rise=rand(0.6,0.78)*H;const vy=-Math.sqrt(2*this.grav*rise);
      this.objs.push({x,y:H+30,vx,vy,r:bomb?24:27,type:bomb?'bomb':gold?'gold':'egg',rot:rand(0,6.28),vr:rand(-4,4)});},
    burst(x,y,c,n){for(let i=0;i<n;i++){const a=rand(0,6.28),s=rand(60,320);this.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.25,.6),c});}},
    explode(o,color){for(let i=0;i<24;i++){const a=rand(0,6.28),sp=rand(90,460);this.parts.push({x:o.x,y:o.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rand(.3,.8),c:i%3===0?'#fff':(i%3===1?'#f4c430':color||'#ffd36b')});}for(let k=-1;k<=1;k+=2){this.shards.push({x:o.x,y:o.y,vx:k*rand(130,280),vy:-rand(140,340),rot:rand(0,6.28),vr:k*rand(5,11),life:0.85,r:o.r,side:k});}this.rings.push({x:o.x,y:o.y,r:o.r,life:0.35});},
    slice(o){o.sliced=true;
      if(o.type==='bomb'){if(this.shield>0){this.shield--;this.burst(o.x,o.y,'#5bc8ff',16);this.flash=0.3;}else{this.flash=0.6;this.explode(o,'#ff5d6c');this.lives=0;this.die();}return;}
      const pts=Math.max(1,Math.round((o.type==='gold'?5:1)*this.mult*(1+this.combo*0.1*this.comboBoost)));this.score+=pts;
      this.combo++;this.comboT=0.8;this.explode(o,o.type==='gold'?'#f4c430':'#ffe6a3');
      if(this.score>this.best){this.best=this.score;store.set('sd_shoot_best',this.best);}},
    die(){if(!this.alive)return;this.alive=false;this.paused=true;if(this.score>this.best){this.best=this.score;store.set('sd_shoot_best',this.best);}showOver();},
    segNear(ax,ay,bx,by,px,py,r){const dx=bx-ax,dy=by-ay;const l2=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/l2;t=clamp(t,0,1);const qx=ax+t*dx,qy=ay+t*dy;return (px-qx)**2+(py-qy)**2<=r*r;},
    update(dt){if(this.paused)return;if(this.flash>0)this.flash-=dt;
      if(this.mode==='shop'){for(const pr of presses){for(const r of this.cardRects){if(pr.x>r.x&&pr.x<r.x+r.w&&pr.y>r.y&&pr.y<r.y+r.h){this.cards[r.i].a(this);this.beginRound();this.updateHud();break;}}}return;}
      if(this.comboT>0){this.comboT-=dt;if(this.comboT<=0)this.combo=0;}
      if(this.left>0){this.spawnT-=dt;if(this.spawnT<=0){this.spawnT=Math.max(0.6,rand(0.9,1.6)-this.round*0.02);const n=1;for(let i=0;i<n&&this.left>0;i++){this.spawn();this.left--;}}}
      for(const o of this.objs){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=this.grav*dt;o.rot+=o.vr*dt;
        if(!o.sliced&&!o.gone&&o.y>H+40&&o.vy>0){o.gone=true;if(o.type!=='bomb'){this.lives--;this.flash=0.25;this.combo=0;if(this.lives<=0)this.die();}}}
      this.objs=this.objs.filter(o=>!o.sliced&&!o.gone);
      for(const pr of presses){for(const o of this.objs){if(!o.sliced&&(pr.x-o.x)**2+(pr.y-o.y)**2<(o.r+this.reach)**2)this.slice(o);}}
      if(pointer.down){const cx=pointer.x,cy=pointer.y;if(this.last){const moved=Math.hypot(cx-this.last.x,cy-this.last.y);
        this.trail.push({x:cx,y:cy,life:0.25});if(moved>2){for(const o of this.objs){if(o.sliced)continue;if(this.segNear(this.last.x,this.last.y,cx,cy,o.x,o.y,o.r+this.reach))this.slice(o);}}}
        this.last={x:cx,y:cy};}else this.last=null;
      for(const t of this.trail)t.life-=dt;this.trail=this.trail.filter(t=>t.life>0);
      for(const pt of this.parts){pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=600*dt;pt.vx*=0.98;pt.life-=dt;}this.parts=this.parts.filter(p=>p.life>0);for(const sh of this.shards){sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;sh.vy+=this.grav*0.8*dt;sh.rot+=sh.vr*dt;sh.life-=dt;}this.shards=this.shards.filter(x=>x.life>0);for(const rg of this.rings){rg.r+=280*dt;rg.life-=dt;}this.rings=this.rings.filter(x=>x.life>0);
      if(this.left<=0&&this.objs.length===0&&this.alive)this.openShop();
      this.updateHud();},
    egg3d(x,y,r,body,dark,rot,opt){opt=opt||{};ctx.save();ctx.translate(x,y);ctx.rotate(rot||0);
      ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(0,r*0.95,r*0.8,r*0.3,0,0,7);ctx.fill();
      const g=ctx.createRadialGradient(-r*0.35,-r*0.5,r*0.1,0,0,r*1.25);g.addColorStop(0,'#fff');g.addColorStop(0.25,body);g.addColorStop(1,dark);
      ctx.beginPath();ctx.ellipse(0,0,r*0.82,r,0,0,7);ctx.fillStyle=g;ctx.fill();
      if(opt.bomb){ctx.strokeStyle='#ff5d6c';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,r*0.5,0,7);ctx.stroke();
        ctx.fillStyle='#ff9f43';ctx.fillRect(-2,-r-6,4,6);ctx.fillStyle='#ffd36b';ctx.beginPath();ctx.arc(0,-r-7,3,0,7);ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold '+(r*0.85)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',0,1);ctx.textAlign='left';ctx.textBaseline='alphabetic';}
      else{ctx.fillStyle='#1b2740';ctx.beginPath();ctx.arc(-r*0.24,-r*0.12,r*0.1,0,7);ctx.arc(r*0.24,-r*0.12,r*0.1,0,7);ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(-r*0.2,-r*0.17,r*0.04,0,7);ctx.arc(r*0.28,-r*0.17,r*0.04,0,7);ctx.fill();}
      ctx.restore();},
    draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17233a');g.addColorStop(1,'#0e1726');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      for(const o of this.objs){const b=o.type==='gold'?'#ffe16b':o.type==='bomb'?'#2a3340':'#f3ead3';const d=o.type==='gold'?'#c8972a':o.type==='bomb'?'#10151e':'#b9a979';this.egg3d(o.x,o.y,o.r,b,d,o.rot,{bomb:o.type==='bomb'});}
      for(const pt of this.parts){ctx.globalAlpha=clamp(pt.life*2,0,1);ctx.fillStyle=pt.c;ctx.fillRect(pt.x-2,pt.y-2,4,4);}ctx.globalAlpha=1;for(const rg of this.rings){ctx.globalAlpha=clamp(rg.life*2.5,0,1);ctx.strokeStyle='#fff3d0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(rg.x,rg.y,rg.r,0,7);ctx.stroke();}ctx.globalAlpha=1;for(const sh of this.shards){ctx.save();ctx.globalAlpha=clamp(sh.life*1.5,0,1);ctx.translate(sh.x,sh.y);ctx.rotate(sh.rot);ctx.fillStyle='#f3ead3';ctx.beginPath();ctx.ellipse(0,0,sh.r*0.72,sh.r*0.92,0,sh.side>0?-1.57:1.57,sh.side>0?1.57:4.71);ctx.lineTo(0,0);ctx.closePath();ctx.fill();ctx.restore();}ctx.globalAlpha=1;
      if(this.trail.length>1){ctx.lineCap='round';for(let i=1;i<this.trail.length;i++){const a=this.trail[i-1],b=this.trail[i],al=clamp(b.life*4,0,1);ctx.globalAlpha=al;ctx.strokeStyle='#eaf1ff';ctx.lineWidth=4*al+1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}ctx.globalAlpha=1;}
      if(pointer.down&&this.mode==='playing')this.egg3d(pointer.x,pointer.y,10,'#f4c430','#b9790d',0,{});

      ctx.restore();},
    vent(x,y,V){const w=W*0.17,h=H*0.2;ctx.fillStyle='#0a0d13';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#1c2430';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);
      for(let i=1;i<4;i++){ctx.strokeStyle='#141a24';ctx.beginPath();ctx.moveTo(x,y+h*i/4);ctx.lineTo(x+w,y+h*i/4);ctx.stroke();}
      if(V.step>=2){const prog=(V.step-1)/2;this.eggFace(x+w/2,y+h/2,10+prog*20,false);}
      if(V.step>=3){ctx.fillStyle='#ff5d6c';ctx.globalAlpha=0.3+0.3*Math.sin(performance.now()/120);ctx.fillRect(x,y,w,h);ctx.globalAlpha=1;}},
    draw(){const sx=this.shake>0?rand(-8,8)*this.shake:0,sy=this.shake>0?rand(-8,8)*this.shake:0;ctx.save();ctx.translate(sx,sy);
      if(!this.cam){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0f17');g.addColorStop(1,'#05070c');ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
        const hw=W*0.26,hx=W/2-hw/2;ctx.fillStyle=this.flashHeld?'#2a2f3a':'#10141d';ctx.fillRect(hx,40,hw,H*0.5);ctx.strokeStyle='#1c2430';ctx.lineWidth=3;ctx.strokeRect(hx,40,hw,H*0.5);
        if(this.H.step>=1){const prog=this.H.step/3;this.eggFace(W/2,60+prog*(H*0.42),10+prog*22,this.flashHeld);}
        this.vent(18,H*0.42,this.L);this.vent(W-18-W*0.17,H*0.42,this.R);
        ctx.fillStyle='#39465c';ctx.font='12px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText('HALL',W/2,36);ctx.fillText('L VENT',18+W*0.085,H*0.42-6);ctx.fillText('R VENT',W-18-W*0.085,H*0.42-6);ctx.textAlign='left';
        if(this.maskHeld){ctx.fillStyle='rgba(10,12,18,.5)';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#232c3a';ctx.lineWidth=46;ctx.strokeRect(23,23,W-46,H-46);
          ctx.fillStyle='#e9e0cc';ctx.beginPath();ctx.ellipse(W/2,H*0.42,70,92,0,0,7);ctx.fill();ctx.fillStyle='#0b0f17';ctx.beginPath();ctx.arc(W/2-24,H*0.4,12,0,7);ctx.arc(W/2+24,H*0.4,12,0,7);ctx.fill();
          ctx.fillStyle='#d9731a';ctx.beginPath();ctx.moveTo(W/2-8,H*0.47);ctx.lineTo(W/2+8,H*0.47);ctx.lineTo(W/2,H*0.5);ctx.fill();}
      } else {ctx.fillStyle='#070a10';ctx.fillRect(-10,-10,W+20,H+20);
        ctx.globalAlpha=0.08;for(let i=0;i<150;i++){ctx.fillStyle=Math.random()<0.5?'#fff':'#000';ctx.fillRect(rand(0,W),rand(40,H-90),2,2);}ctx.globalAlpha=1;
        ctx.fillStyle='#0d1420';ctx.fillRect(16,46,W-32,H-150);ctx.strokeStyle='#223047';ctx.lineWidth=2;ctx.strokeRect(16,46,W-32,H-150);
        ctx.fillStyle='#8ba0c4';ctx.font='bold 18px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText('CAM · '+this.cams[this.camSel],W/2,76);
        const cx=W/2,cy=H*0.42;
        if(this.camSel===0||this.camSel===1){const V=this.camSel===0?this.L:this.R;ctx.fillStyle='#39465c';ctx.font='13px "Trebuchet MS",sans-serif';ctx.fillText('egg distance',cx,cy-40);
          for(let i=0;i<4;i++){ctx.fillStyle=i<=V.step?'#ff5d6c':'#223047';ctx.beginPath();ctx.arc(cx-60+i*40,cy,10,0,7);ctx.fill();}
          ctx.fillStyle=V.step>=3?'#ff5d6c':'#8ba0c4';ctx.fillText(V.step>=3?'AT YOUR VENT — lower & MASK!':'crawling closer...',cx,cy+44);}
        else if(this.camSel===2){ctx.fillStyle=this.H.step>=3?'#ff5d6c':'#8ba0c4';ctx.font='13px "Trebuchet MS",sans-serif';ctx.fillText(this.H.step>=3?'At the hall door — lower & FLASH!':(this.H.step>=1?'something in the hall...':'hall is clear'),cx,cy);}
        else{ctx.fillStyle='#39465c';ctx.font='13px "Trebuchet MS",sans-serif';ctx.fillText('music box',cx,cy-40);
          ctx.fillStyle='#223047';roundRect(cx-90,cy-10,180,16,8);ctx.fill();ctx.fillStyle=this.box<0.3?'#ff5d6c':'#3ddc97';roundRect(cx-90,cy-10,180*clamp(this.box,0,1),16,8);ctx.fill();
          ctx.fillStyle=this.box<=0?'#ff5d6c':'#8ba0c4';ctx.fillText(this.box<=0?'STOPPED! wind it NOW':'keep it wound',cx,cy+40);}
        ctx.textAlign='left';}
      ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,30);ctx.textBaseline='middle';
      ctx.fillStyle='#8ba0c4';ctx.font='12px "Trebuchet MS",sans-serif';ctx.textAlign='left';ctx.fillText('BATT',10,15);ctx.fillStyle='#223047';roundRect(44,9,70,12,6);ctx.fill();ctx.fillStyle=this.batt<25?'#ff5d6c':'#f4c430';roundRect(44,9,70*clamp(this.batt/100,0,1),12,6);ctx.fill();
      ctx.fillStyle='#8ba0c4';ctx.fillText('BOX',124,15);ctx.fillStyle='#223047';roundRect(150,9,70,12,6);ctx.fill();ctx.fillStyle=this.box<0.3?'#ff5d6c':'#3ddc97';roundRect(150,9,70*clamp(this.box,0,1),12,6);ctx.fill();
      ctx.fillStyle='#eaf1ff';ctx.textAlign='right';ctx.font='bold 13px "Trebuchet MS",sans-serif';ctx.fillText((this.hour===12?'12':this.hour)+' AM',W-12,15);ctx.textAlign='left';ctx.textBaseline='alphabetic';
      const L2=this.lay();const drawBtn=(b,active)=>{if(!b)return;ctx.fillStyle=active?'#1c2a40':'#121a28';roundRect(b.x,b.y,b.w,b.h,10);ctx.fill();ctx.strokeStyle=active?'#f4c430':'#26344d';ctx.lineWidth=1.5;ctx.stroke();
        ctx.fillStyle='#eaf1ff';ctx.font='bold 14px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.label,b.x+b.w/2,b.y+b.h/2);ctx.textAlign='left';ctx.textBaseline='alphabetic';};
      if(!this.cam){drawBtn(L2.flash,this.flashHeld);drawBtn(L2.cameras,false);drawBtn(L2.mask,this.maskHeld);}
      else{for(const cb of L2.cams){ctx.fillStyle=this.camSel===cb.i?'#1c2a40':'#121a28';roundRect(cb.x,cb.y,cb.w,cb.h,10);ctx.fill();if(this.camSel===cb.i){ctx.strokeStyle='#f4c430';ctx.lineWidth=1.5;ctx.stroke();}
        ctx.fillStyle='#cdd7ea';ctx.font='12px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(this.cams[cb.i],cb.x+cb.w/2,cb.y+cb.h/2);ctx.textAlign='left';ctx.textBaseline='alphabetic';}
        drawBtn(L2.cameras,false);if(L2.wind)drawBtn(L2.wind,this.camHeldWind);}
      ctx.restore();
      if(this.mode==='dead'){const k=clamp(this.deadT*2,0,1);ctx.fillStyle='rgba(0,0,0,'+0.5*k+')';ctx.fillRect(0,0,W,H);
        this.scaryEgg(W/2,H*0.42,Math.min(W,H)*0.32);
        if(this.deadT>1.0){ctx.fillStyle='rgba(5,7,12,.88)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#ff5d6c';ctx.font='bold 30px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText('The eggs got you',W/2,H*0.38);
          ctx.fillStyle='#cdd7ea';ctx.font='15px "Trebuchet MS",sans-serif';ctx.fillText('Caught by: '+this.who,W/2,H*0.38+30);ctx.fillText('Best night survived: '+this.best,W/2,H*0.38+54);
          ctx.fillStyle='#f4c430';ctx.font='bold 18px "Trebuchet MS",sans-serif';ctx.fillText('Tap to try again (Night 1)',W/2,H*0.62);ctx.textAlign='left';}}
      if(this.mode==='clear'){ctx.fillStyle='rgba(5,10,16,.85)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#3ddc97';ctx.font='bold 34px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillText('6 AM',W/2,H*0.34);
        ctx.fillStyle='#eaf1ff';ctx.font='18px "Trebuchet MS",sans-serif';ctx.fillText(this.night>=5?'You survived all 5 nights!':'Night '+this.night+' cleared',W/2,H*0.34+34);
        ctx.fillStyle='#f4c430';ctx.font='bold 18px "Trebuchet MS",sans-serif';ctx.fillText(this.night>=5?'Tap to play again':'Tap for Night '+(this.night+1),W/2,H*0.6);ctx.textAlign='left';}}
  };

const registry={shooter:Shooter,climber:Climber,craft:Craft,td:TD,fiveeggs:FiveEggs,puzzle:Puzzle,snake:Snake,sandbox:Sandbox,idle:Idle};
  const CARDS=[
    {id:'shooter',icon:'🔪',name:'Shell Shock',desc:'Slice flying eggs with a swipe, dodge the bomb eggs, grab upgrades between rounds.'},
    {id:'fiveeggs',icon:'🌙',name:'Five Eggs',desc:'A spooky night shift — watch the vents, wear the mask, wind the music box, survive to 6 AM.'},
    {id:'climber',icon:'🧗',name:'Only Up',desc:'Climb four themed worlds with checkpoint flags that save you from the long fall.'},
    {id:'craft',icon:'🧪',name:'Infinite Craft',desc:'Combine elements into anything. Start with four, discover whatever you dream up.'},
    {id:'td',icon:'🗼',name:'Tower Rush',desc:'Tower defense — buy and upgrade towers, survive the waves, unlock new maps.'},
    {id:'puzzle',icon:'🔢',name:'2048',desc:'Slide and merge tiles to build bigger numbers. Simple to learn, hard to stop.'},
    {id:'snake',icon:'🐍',name:'Snake',desc:'The classic. Eat, grow, speed up, and try not to tie yourself in a knot.'},
    {id:'sandbox',icon:'🏖️',name:'Sand Pit',desc:'A physics toy — sand, water, fire, plants. No goal, just play with it.'},
    {id:'idle',icon:'🍞',name:'Duck Pond',desc:'A cozy idle clicker. Tap for crumbs, buy helpers, watch it grow itself.'},
  ];
  const cardsEl=document.getElementById('cards');
  for(const c of CARDS){const el=document.createElement('div');el.className='card';el.tabIndex=0;el.setAttribute('role','button');
    el.innerHTML='<div class="art">'+c.icon+'</div><h2>'+c.name+'</h2><p>'+c.desc+'</p>';
    const go=()=>openGame(registry[c.id]);el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')go();});cardsEl.appendChild(el);}

  document.addEventListener('visibilitychange',()=>{if(document.hidden&&current&&current.save)current.save();});
  resize();
})();
</script>
